<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя Библиотека Масел 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf8f2;
    --blush: #f5e6e0;
    --sage: #c8d5c0;
    --dusty-rose: #d4a5a5;
    --lavender: #c9c0d3;
    --peach: #e8c9b0;
    --forest: #7a9e7e;
    --muted-text: #7a6f6a;
    --dark: #3d3530;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--dark);
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #f9ede8 0%, #ede4f0 40%, #deeade 100%);
    padding: 60px 40px 50px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(201,192,211,0.3) 0%, transparent 70%);
    top: -100px; right: -100px; border-radius: 50%;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(200,213,192,0.35) 0%, transparent 70%);
    bottom: -80px; left: -80px; border-radius: 50%;
  }
  .hero-emoji { font-size: 3rem; display: block; margin-bottom: 16px; }
  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 300;
    color: var(--dark);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .hero h1 span { font-style: italic; color: #8a6f8a; }
  .hero-sub {
    margin-top: 12px;
    font-size: 0.95rem;
    color: var(--muted-text);
    letter-spacing: 0.08em;
    font-weight: 300;
  }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 36px;
    flex-wrap: wrap;
  }
  .stat {
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 16px 28px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.8);
  }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: var(--dark);
    display: block;
  }
  .stat-label { font-size: 0.75rem; color: var(--muted-text); letter-spacing: 0.1em; text-transform: uppercase; }

  /* DUPLICATES BANNER */
  .duplicates-banner {
    background: linear-gradient(90deg, #f5e6e0, #ede4f0);
    border-left: 4px solid var(--dusty-rose);
    margin: 0 40px 0;
    padding: 14px 24px;
    border-radius: 0 12px 12px 0;
    font-size: 0.88rem;
    color: var(--muted-text);
  }
  .duplicates-banner strong { color: var(--dark); }

  /* FILTERS */
  .filter-section {
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(253,248,242,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .filter-toggle-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .filter-toggle-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .active-cat-chip {
    font-size: 0.8rem;
    background: var(--dark);
    color: white;
    border-radius: 20px;
    padding: 4px 12px;
    font-weight: 400;
  }
  .toggle-icon {
    font-size: 0.75rem;
    color: var(--muted-text);
    transition: transform 0.3s ease;
    display: inline-block;
  }
  .toggle-icon.open { transform: rotate(180deg); }
  .filter-label {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted-text);
    font-weight: 500;
  }
  .filters-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.35s ease, padding 0.3s ease;
  }
  .filters-body.open {
    max-height: 300px;
    padding-top: 12px;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-btn {
    border: 1.5px solid transparent;
    border-radius: 30px;
    padding: 8px 20px;
    font-family: 'Jost', sans-serif;
    font-size: 0.83rem;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .filter-btn.all { background: var(--dark); color: white; border-color: var(--dark); }
  .filter-btn[data-cat="citrus"] { background: #fff8ed; border-color: #f0c87a; color: #8a6420; }
  .filter-btn[data-cat="floral"] { background: #fdf0f4; border-color: #e8a5bc; color: #8a3a5a; }
  .filter-btn[data-cat="herbal"] { background: #f0f5ee; border-color: #9aba96; color: #3a6040; }
  .filter-btn[data-cat="woody"] { background: #f5f0eb; border-color: #c4a882; color: #6b4e2a; }
  .filter-btn[data-cat="spicy"] { background: #fdf0ec; border-color: #e8937a; color: #8a3820; }
  .filter-btn[data-cat="blend"] { background: #f0eef8; border-color: #a89ad0; color: #4a3880; }
  .filter-btn[data-cat="earthy"] { background: #f0ede8; border-color: #b0a090; color: #5a4a38; }
  .filter-btn[data-cat="resinous"] { background: #fdf4e8; border-color: #d0a060; color: #6a4a10; }
  .filter-btn.active { box-shadow: 0 4px 14px rgba(0,0,0,0.12); transform: translateY(-1px); }
  .filter-btn:not(.active):hover { transform: translateY(-2px); box-shadow: 0 3px 10px rgba(0,0,0,0.08); }

  .search-box {
    margin-top: 10px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    max-width: 400px;
    border: 1.5px solid #e0d8d0;
    border-radius: 30px;
    padding: 10px 20px 10px 42px;
    font-family: 'Jost', sans-serif;
    font-size: 0.88rem;
    background: white;
    color: var(--dark);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--dusty-rose); }
  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1rem;
    opacity: 0.5;
  }

  /* GRID */
  .grid-section { padding: 32px 40px 60px; }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 300;
    font-style: italic;
    color: var(--muted-text);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .oils-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  /* OIL CARD */
  .oil-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    transition: all 0.3s ease;
    border: 1px solid rgba(0,0,0,0.04);
    animation: fadeIn 0.4s ease forwards;
  }
  .oil-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .oil-card.hidden { display: none; }

  .card-header {
    padding: 22px 22px 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .oil-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
  }
  .oil-title { flex: 1; }
  .oil-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--dark);
    line-height: 1.2;
  }
  .oil-latin {
    font-size: 0.75rem;
    color: var(--muted-text);
    font-style: italic;
    margin-top: 2px;
  }
  .duplicate-badge {
    font-size: 0.65rem;
    background: #fff0d4;
    color: #b07820;
    border: 1px solid #f0d090;
    border-radius: 20px;
    padding: 2px 8px;
    font-weight: 500;
    margin-top: 4px;
    display: inline-block;
    letter-spacing: 0.05em;
  }

  .cat-badge {
    font-size: 0.68rem;
    border-radius: 20px;
    padding: 4px 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: 500;
    letter-spacing: 0.05em;
    margin: 0 22px 14px;
  }

  .card-desc {
    padding: 0 22px 16px;
    font-size: 0.87rem;
    color: var(--muted-text);
    line-height: 1.65;
    font-weight: 300;
  }

  .props-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 22px 16px;
  }
  .prop-tag {
    font-size: 0.72rem;
    background: var(--cream);
    border: 1px solid #e8e0d8;
    border-radius: 20px;
    padding: 4px 10px;
    color: var(--muted-text);
    letter-spacing: 0.04em;
  }

  /* EXPAND SECTION */
  .expand-btn {
    width: calc(100% - 44px);
    margin: 0 22px 18px;
    border: 1.5px dashed #e0d8d0;
    background: transparent;
    border-radius: 12px;
    padding: 10px;
    font-family: 'Jost', sans-serif;
    font-size: 0.8rem;
    color: var(--muted-text);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    letter-spacing: 0.04em;
  }
  .expand-btn:hover { background: var(--cream); border-color: var(--dusty-rose); color: var(--dark); }
  .expand-btn .arrow { transition: transform 0.3s ease; display: inline-block; }
  .expand-btn.open .arrow { transform: rotate(180deg); }

  .expand-content {
    display: none;
    padding: 0 22px 20px;
    border-top: 1px solid #f0ebe4;
    margin-top: -4px;
  }
  .expand-content.open { display: block; }
  .expand-section-title {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted-text);
    margin: 16px 0 8px;
    font-weight: 500;
  }
  .usage-list {
    list-style: none;
    padding: 0;
  }
  .usage-list li {
    font-size: 0.84rem;
    color: var(--dark);
    padding: 6px 0;
    border-bottom: 1px solid #f5f0ea;
    display: flex;
    gap: 8px;
    line-height: 1.5;
  }
  .usage-list li:last-child { border-bottom: none; }
  .usage-list li::before { content: '·'; color: var(--dusty-rose); font-size: 1.2rem; line-height: 1.2; }

  .recipe-box {
    background: var(--cream);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 10px;
  }
  .recipe-title {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--dark);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .recipe-text {
    font-size: 0.8rem;
    color: var(--muted-text);
    line-height: 1.6;
  }

  /* CATEGORY COLORS */
  .cat-citrus .oil-icon { background: #fff8ed; }
  .cat-floral .oil-icon { background: #fdf0f4; }
  .cat-herbal .oil-icon { background: #f0f5ee; }
  .cat-woody .oil-icon { background: #f5f0eb; }
  .cat-spicy .oil-icon { background: #fdf0ec; }
  .cat-blend .oil-icon { background: #f0eef8; }
  .cat-earthy .oil-icon { background: #f0ede8; }
  .cat-resinous .oil-icon { background: #fdf4e8; }

  .cat-citrus .cat-badge { background: #fff8ed; color: #8a6420; border: 1px solid #f0c87a; }
  .cat-floral .cat-badge { background: #fdf0f4; color: #8a3a5a; border: 1px solid #e8a5bc; }
  .cat-herbal .cat-badge { background: #f0f5ee; color: #3a6040; border: 1px solid #9aba96; }
  .cat-woody .cat-badge { background: #f5f0eb; color: #6b4e2a; border: 1px solid #c4a882; }
  .cat-spicy .cat-badge { background: #fdf0ec; color: #8a3820; border: 1px solid #e8937a; }
  .cat-blend .cat-badge { background: #f0eef8; color: #4a3880; border: 1px solid #a89ad0; }
  .cat-earthy .cat-badge { background: #f0ede8; color: #5a4a38; border: 1px solid #b0a090; }
  .cat-resinous .cat-badge { background: #fdf4e8; color: #6a4a10; border: 1px solid #d0a060; }

  .count-label {
    font-size: 0.8rem;
    color: var(--muted-text);
    margin-left: 8px;
    font-family: 'Jost', sans-serif;
  }

  @media (max-width: 600px) {
    .hero { padding: 40px 20px 36px; }
    .filter-section { padding: 20px; }
    .grid-section { padding: 20px 20px 50px; }
    .duplicates-banner { margin: 0 20px; }
    .stats-row { gap: 16px; }
  }
</style>
</head>
<body>

<div class="hero">
  <span class="hero-emoji">🌿</span>
  <h1>Моя <span>Библиотека</span> Масел</h1>
  <p class="hero-sub">dōTERRA · Эфирные масла</p>
  <div class="stats-row">
    <div class="stat"><span class="stat-num" id="total-count">53</span><span class="stat-label">Всего флаконов</span></div>
    <div class="stat"><span class="stat-num" id="unique-count">48</span><span class="stat-label">Уникальных масел</span></div>
    <div class="stat"><span class="stat-num">3</span><span class="stat-label">Повторяются</span></div>
    <div class="stat"><span class="stat-num">8</span><span class="stat-label">Категорий</span></div>
  </div>
</div>

<div style="padding: 20px 40px 0;" id="dup-banner">
  <div class="duplicates-banner">
    🔁 <strong>Повторяющиеся масла:</strong> Lavender (3×) · Juniper Berry (2×) · Siberian Fir (2×)
  </div>
</div>

<div class="filter-section">
  <div class="filter-toggle-bar" onclick="toggleFilters()">
    <div class="filter-toggle-left">
      <span class="filter-label">🌿 Фильтр</span>
      <span class="active-cat-chip" id="activeCatLabel">✨ Все</span>
    </div>
    <span class="toggle-icon" id="toggleIcon">▾</span>
  </div>
  <div class="filters-body" id="filtersBody">
    <div class="filters">
      <button class="filter-btn all active" onclick="filterOils('all', '✨ Все')">✨ Все</button>
      <button class="filter-btn" data-cat="citrus" onclick="filterOils('citrus', '🍋 Цитрусовые')">🍋 Цитрусовые</button>
      <button class="filter-btn" data-cat="floral" onclick="filterOils('floral', '🌸 Цветочные')">🌸 Цветочные</button>
      <button class="filter-btn" data-cat="herbal" onclick="filterOils('herbal', '🌿 Травяные')">🌿 Травяные</button>
      <button class="filter-btn" data-cat="woody" onclick="filterOils('woody', '🌲 Древесные')">🌲 Древесные</button>
      <button class="filter-btn" data-cat="spicy" onclick="filterOils('spicy', '🌶️ Пряные')">🌶️ Пряные</button>
      <button class="filter-btn" data-cat="blend" onclick="filterOils('blend', '💜 Смеси')">💜 Смеси</button>
      <button class="filter-btn" data-cat="earthy" onclick="filterOils('earthy', '🌍 Земляные')">🌍 Земляные</button>
      <button class="filter-btn" data-cat="resinous" onclick="filterOils('resinous', '🫧 Смолистые')">🫧 Смолистые</button>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Поиск масла..." oninput="searchOils(this.value)">
    </div>
  </div>
</div>

<div class="grid-section">
  <div class="oils-grid" id="oilsGrid">
    <!-- Cards injected by JS -->
  </div>
  <p id="no-results" style="display:none; text-align:center; color:var(--muted-text); padding:60px 0; font-style:italic; font-family:'Cormorant Garamond',serif; font-size:1.3rem;">Ничего не найдено 🌿</p>
</div>

<script>
const oils = [
  // CITRUS

function renderCard(oil) {
  const catLabels = {
    citrus: "🍋 Цитрусовые", floral: "🌸 Цветочные", herbal: "🌿 Травяные",
    woody: "🌲 Древесные", spicy: "🌶️ Пряные", blend: "💜 Смеси",
    earthy: "🌍 Земляные", resinous: "🫧 Смолистые"
  };
  const dupBadge = oil.duplicate ? `<span class="duplicate-badge">🔁 ${oil.duplicate}× в коллекции</span>` : '';
  const propTags = oil.props.map(p => `<span class="prop-tag">${p}</span>`).join('');
  const usageItems = oil.uses.map(u => `<li>${u}</li>`).join('');
  const id = oil.name.replace(/[^a-z]/gi, '_');

  return `
  <div class="oil-card cat-${oil.cat}" data-cat="${oil.cat}" data-name="${oil.name.toLowerCase()}">
    <div class="card-header">
      <div class="oil-icon">${oil.emoji}</div>
      <div class="oil-title">
        <div class="oil-name">${oil.name}</div>
        <div class="oil-latin">${oil.latin}</div>
        ${dupBadge}
      </div>
    </div>
    <span class="cat-badge">${catLabels[oil.cat]}</span>
    <p class="card-desc">${oil.desc}</p>
    <div class="props-row">${propTags}</div>
    <button class="expand-btn" onclick="toggleExpand('${id}', this)">
      Способы применения и рецепты <span class="arrow">▾</span>
    </button>
    <div class="expand-content" id="exp_${id}">
      <div class="expand-section-title">💡 Способы применения</div>
      <ul class="usage-list">${usageItems}</ul>
      ${oil.recipe ? `
      <div class="expand-section-title" style="margin-top:16px">🧪 Рецепт</div>
      <div class="recipe-box">
        <div class="recipe-title">${oil.recipe.title}</div>
        <div class="recipe-text">${oil.recipe.text}</div>
      </div>` : ''}
    </div>
  </div>`;
}

let currentFilter = 'all';
let currentSearch = '';

function renderAll() {
  const grid = document.getElementById('oilsGrid');
  grid.innerHTML = oils.map(renderCard).join('');
  applyFilters();
}

function applyFilters() {
  const cards = document.querySelectorAll('.oil-card');
  let visible = 0;
  cards.forEach(card => {
    const matchCat = currentFilter === 'all' || card.dataset.cat === currentFilter;
    const matchSearch = !currentSearch || card.dataset.name.includes(currentSearch.toLowerCase());
    if (matchCat && matchSearch) {
      card.classList.remove('hidden');
      card.style.animationDelay = (visible * 0.04) + 's';
      visible++;
    } else {
      card.classList.add('hidden');
    }
  });
  document.getElementById('no-results').style.display = visible === 0 ? 'block' : 'none';
}

function toggleFilters() {
  const body = document.getElementById('filtersBody');
  const icon = document.getElementById('toggleIcon');
  const isOpen = body.classList.toggle('open');
  icon.classList.toggle('open', isOpen);
}

function filterOils(cat, label) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active',
      (cat === 'all' && btn.classList.contains('all')) || btn.dataset.cat === cat
    );
  });
  document.getElementById('activeCatLabel').textContent = label || '✨ Все';
  // Close panel after selecting
  document.getElementById('filtersBody').classList.remove('open');
  document.getElementById('toggleIcon').classList.remove('open');
  applyFilters();
}

function searchOils(val) {
  currentSearch = val.trim();
  applyFilters();
}

function toggleExpand(id, btn) {
  const content = document.getElementById('exp_' + id);
  const isOpen = content.classList.contains('open');
  content.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
  btn.querySelector('.arrow').style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
}

renderAll();
